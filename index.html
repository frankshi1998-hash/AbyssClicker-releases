<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Added to an iPhone's home screen, the page opens without Safari's bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0b0812">
    <title>AbyssClicker</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0b0812; }
      /* Fullscreen on a phone (the browser's bars took the room): a corner button. */
      #full { position: absolute; left: 6px; top: 6px; width: 34px; height: 34px; border: 1px solid #5a4a7a; border-radius: 4px;
              background: rgba(22, 15, 34, 0.7); color: #f2e2b0; font: 20px/32px sans-serif; text-align: center; display: none; z-index: 2; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0b0812; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                 color: #f2e2b0; font: 16px/1.4 Georgia, serif; letter-spacing: 0.08em; pointer-events: none; }
      #bar { width: min(360px, 60vw); height: 10px; border: 2px solid #5a4a7a; background: #160f22; }
      #fill { width: 0%; height: 100%; background: #8a5ad0; transition: width 0.2s; }
      #error { color: #ff8a7a; max-width: 80vw; text-align: center; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="full" title="Fullscreen">&#x26F6;</div>
    <script>
      // Phones and tablets: the first touch makes the page fullscreen, and the corner button does it
      // again after leaving. iPhones' Safari has no fullscreen for pages (add it to the home screen).
      (function () {
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        var touch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
        var button = document.querySelector("#full");
        function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
        function goFull() {
          if (!request || isFull()) { return; }
          try {
            var done = request.call(root, { navigationUI: "hide" });
            if (done && done.catch) { done.catch(function () {}); }
          } catch (e) { }
        }
        function refresh() { button.style.display = touch && request && !isFull() ? "block" : "none"; }
        if (!touch || !request) { return; }
        var first = true;
        window.addEventListener("touchend", function () { if (first) { first = false; goFull(); } }, { passive: true });
        button.addEventListener("touchend", function (e) { e.preventDefault(); e.stopPropagation(); goFull(); });
        button.addEventListener("click", goFull);
        document.addEventListener("fullscreenchange", refresh);
        document.addEventListener("webkitfullscreenchange", refresh);
        refresh();
      })();
    </script>
    <div id="loading">
      <div>DESCENDING…</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script src="Build/AbyssClicker_v0.8.3_web.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Right-click inspects a tile: the browser's menu must not open over the board.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/AbyssClicker_v0.8.3_web.data.unityweb",
        frameworkUrl: "Build/AbyssClicker_v0.8.3_web.framework.js.unityweb",
        codeUrl: "Build/AbyssClicker_v0.8.3_web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AbyssClicker1",
        productVersion: "1.0",
        matchWebGLToCanvasSize: true,
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        var error = document.querySelector("#error");
        error.style.display = "block";
        error.textContent = message;
      });
    </script>
  </body>
</html>
